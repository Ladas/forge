too-many-lines-threshold = 30
# Clippy's default budget, stated explicitly so the gate is documented
# in one place (AGENTS.md quotes this value).
cognitive-complexity-threshold = 25
too-many-arguments-threshold = 5
max-fn-params-bools = 2
max-struct-bools = 2
enum-variant-size-threshold = 128
future-size-threshold = 4096
type-complexity-threshold = 200
stack-size-threshold = 16384
avoid-breaking-exported-api = false
msrv = "1.96"
# ".." keeps clippy's built-in defaults; extend per project (product names, protocol acronyms)
doc-valid-idents = ["..", "IPv4", "IPv6", "gRPC", "OpenTelemetry", "MiB", "GiB", "KiB"]
disallowed-methods = [
    { path = "std::io::stdin", reason = "forge must not read interactive input in automated mode" },
    { path = "std::io::Stdin::read_line", reason = "forge must not read interactive input in automated mode" },
]

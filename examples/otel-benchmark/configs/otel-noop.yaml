# OTel noop benchmark config.
# OTel feature is compiled in but no OTLP endpoint is configured,
# so spans are created but never exported.

admin:
  address: "0.0.0.0:9901"

insecure_options:
  allow_public_admin: true

listeners:
  - name: default
    address: "0.0.0.0:8080"
    filter_chains: [main]

filter_chains:
  - name: main
    filters:
      - filter: request_id

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: echo

      - filter: load_balancer
        clusters:
          - name: echo
            endpoints:
              - "echo-backend.default.svc:8080"

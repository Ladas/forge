# Praxis Deployment for benchmark mode.
# ConfigMap is NOT included here — setup.sh creates it separately
# to avoid overwriting with empty data.
# No args are specified — the Containerfile ENTRYPOINT already
# includes [-c, /etc/praxis/config.yaml].
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis-proxy
  template:
    metadata:
      labels:
        app: praxis-proxy
    spec:
      containers:
        - name: praxis-proxy
          image: praxis:dev-otel
          ports:
            - containerPort: 8080
              name: proxy
            - containerPort: 9901
              name: admin
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthy
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthy
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-proxy
  namespace: default
spec:
  type: NodePort
  selector:
    app: praxis-proxy
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: proxy
    - port: 9901
      targetPort: 9901
      nodePort: 30901
      name: admin

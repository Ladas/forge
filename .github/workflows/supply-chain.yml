name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Advisories are published against a dependency set that does not change
  # when nobody commits, so the scan has to run on a clock, not on pushes.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  # Pinned so the cached binary is replaced when the tool is upgraded. With a
  # constant cache key the `command -v` guard below would keep whichever
  # version first populated the cache, freezing the scanner indefinitely.
  # Dependabot cannot bump these, so raise them by hand when a scanner
  # release lands; a stale pin under-reports advisories just as a stale
  # cache did.
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  security-audit:
    name: Cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-audit-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: |
          command -v cargo-audit \
            || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - run: cargo audit

  dependency-check:
    name: Cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          command -v cargo-deny \
            || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - run: cargo deny check
